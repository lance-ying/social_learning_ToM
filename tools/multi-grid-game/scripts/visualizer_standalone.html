<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Path Visualizer</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        #visualization {
            display: inline-block;
            padding: 20px;
            background: white;
        }
        .grid-container {
            position: relative;
            display: inline-block;
            border: 2px solid #333;
            background: white;
        }
        .cell {
            position: absolute;
            box-sizing: border-box;
        }
        .wall {
            background: #1f2937;
        }
        .empty {
            background: white;
            border: 1px solid #e5e7eb;
        }
        .agent {
            background: #3b82f6;
            border-radius: 50%;
            z-index: 10;
        }
        .treasure {
            background: #fbbf24;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #78350f;
            z-index: 5;
        }
        .wizard {
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            z-index: 5;
        }
        .wizard.red { background: #fca5a5; color: #991b1b; }
        .wizard.blue { background: #93c5fd; color: #1e3a8a; }
        .wizard.empty { background: #d1d5db; color: #4b5563; }
        .barrier {
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            z-index: 5;
        }
        .barrier.red { background: #dc2626; color: white; }
        .barrier.blue { background: #2563eb; color: white; }
        .arrow {
            position: absolute;
            z-index: 3;
            transition: opacity 0.2s;
        }
        .info {
            margin-top: 20px;
            padding: 15px;
            background: #f3f4f6;
            border-radius: 8px;
        }
        .info h2 {
            margin: 0 0 10px 0;
            font-size: 18px;
        }
        .info p {
            margin: 5px 0;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="visualization">
        <div class="info">
            <h2 id="levelTitle">Loading...</h2>
            <p id="pathInfo"></p>
            <p id="goalInfo"></p>
        </div>
        <div id="gridContainer"></div>
    </div>

    <script>
        const CELL_SIZE = 48;

        // Get parameters from URL
        const params = new URLSearchParams(window.location.search);
        const levelData = JSON.parse(decodeURIComponent(params.get('levelData') || '{}'));
        const pathType = params.get('pathType') || 'experienced1';

        function parseAsciiMap(asciiMap) {
            const rows = asciiMap.trim().split('\n');
            const height = rows.length;
            const width = Math.max(...rows.map(r => r.length));

            const walls = [];
            const wizards = [];
            const barriers = [];
            const treasures = [];
            let agent = null;

            // First pass: collect treasures and sort them
            const treasurePositions = [];
            rows.forEach((row, y) => {
                for (let x = 0; x < row.length; x++) {
                    if (row[x] === 'g') {
                        treasurePositions.push({ x, y });
                    }
                }
            });

            // Sort by y first, then x (top to bottom, left to right)
            treasurePositions.sort((a, b) => a.y === b.y ? a.x - b.x : a.y - b.y);

            // Second pass: parse everything
            rows.forEach((row, y) => {
                for (let x = 0; x < row.length; x++) {
                    const char = row[x];

                    if (char === 'W') walls.push({ x, y });
                    else if (char === 'Z' || char === 'M' || char === 'O') agent = { x, y };
                    else if (char === 'r') wizards.push({ x, y, type: 'red' });
                    else if (char === 'b') wizards.push({ x, y, type: 'blue' });
                    else if (char === 'e') wizards.push({ x, y, type: 'empty' });
                    else if (char === 'R') barriers.push({ x, y, type: 'red' });
                    else if (char === 'B') barriers.push({ x, y, type: 'blue' });
                    else if (char === 'g') {
                        const idx = treasurePositions.findIndex(t => t.x === x && t.y === y);
                        const label = idx >= 0 && idx < 3 ? String.fromCharCode(65 + idx) : '?';
                        treasures.push({ x, y, label });
                    }
                }
            });

            return { width, height, walls, wizards, barriers, treasures, agent };
        }

        function getMoveOffset(move) {
            const moves = {
                'up': [0, -1],
                'down': [0, 1],
                'left': [-1, 0],
                'right': [1, 0]
            };
            return moves[move] || [0, 0];
        }

        function drawArrow(x, y, direction, opacity, index, totalSteps) {
            const arrow = document.createElement('div');
            arrow.className = 'arrow';
            arrow.style.left = `${x * CELL_SIZE}px`;
            arrow.style.top = `${y * CELL_SIZE}px`;
            arrow.style.width = `${CELL_SIZE}px`;
            arrow.style.height = `${CELL_SIZE}px`;
            arrow.style.opacity = opacity;
            arrow.style.display = 'flex';
            arrow.style.alignItems = 'center';
            arrow.style.justifyContent = 'center';

            const arrows = {
                'up': '↑',
                'down': '↓',
                'left': '←',
                'right': '→'
            };

            const size = Math.max(16, Math.min(24, CELL_SIZE * 0.5));
            arrow.innerHTML = `<span style="font-size: ${size}px; color: #3b82f6; font-weight: bold;">${arrows[direction] || '•'}</span>`;

            return arrow;
        }

        function renderVisualization() {
            if (!levelData.asciiMap) {
                document.getElementById('levelTitle').textContent = 'Error: No level data';
                return;
            }

            const map = parseAsciiMap(levelData.asciiMap);
            const path = levelData.agentPaths?.[1]?.movements?.[pathType]?.path || [];
            const goal = levelData.agentPaths?.[1]?.movements?.[pathType]?.goal || 1;

            // Update info
            document.getElementById('levelTitle').textContent = `Level: ${levelData.id} - ${pathType}`;
            document.getElementById('pathInfo').textContent = `Path Length: ${path.length} steps`;
            const goalLetter = String.fromCharCode(64 + goal); // 1=A, 2=B, 3=C
            document.getElementById('goalInfo').textContent = `Target Goal: ${goal} (Treasure ${goalLetter})`;

            // Create grid
            const container = document.getElementById('gridContainer');
            container.className = 'grid-container';
            container.style.width = `${map.width * CELL_SIZE}px`;
            container.style.height = `${map.height * CELL_SIZE}px`;

            // Draw cells
            for (let y = 0; y < map.height; y++) {
                for (let x = 0; x < map.width; x++) {
                    const isWall = map.walls.some(w => w.x === x && w.y === y);
                    const cell = document.createElement('div');
                    cell.className = `cell ${isWall ? 'wall' : 'empty'}`;
                    cell.style.left = `${x * CELL_SIZE}px`;
                    cell.style.top = `${y * CELL_SIZE}px`;
                    cell.style.width = `${CELL_SIZE}px`;
                    cell.style.height = `${CELL_SIZE}px`;
                    container.appendChild(cell);
                }
            }

            // Draw path arrows
            if (map.agent && path.length > 0) {
                let currentX = map.agent.x;
                let currentY = map.agent.y;

                path.forEach((move, index) => {
                    const [dx, dy] = getMoveOffset(move);
                    const nextX = currentX + dx;
                    const nextY = currentY + dy;

                    // Check if next position is a wizard (interaction, don't move)
                    const isWizard = map.wizards.some(w => w.x === nextX && w.y === nextY);

                    if (!isWizard) {
                        const opacity = 0.3 + (0.7 * (index / path.length));
                        const arrow = drawArrow(currentX, currentY, move, opacity, index, path.length);
                        container.appendChild(arrow);
                        currentX = nextX;
                        currentY = nextY;
                    } else {
                        // Draw interaction indicator at current position
                        const arrow = drawArrow(currentX, currentY, move, 0.5, index, path.length);
                        container.appendChild(arrow);
                    }
                });
            }

            // Draw wizards
            map.wizards.forEach(wizard => {
                const el = document.createElement('div');
                el.className = `cell wizard ${wizard.type}`;
                el.style.left = `${wizard.x * CELL_SIZE}px`;
                el.style.top = `${wizard.y * CELL_SIZE}px`;
                el.style.width = `${CELL_SIZE}px`;
                el.style.height = `${CELL_SIZE}px`;
                el.innerHTML = wizard.type === 'red' ? '🔴' : wizard.type === 'blue' ? '🔵' : '⚪';
                container.appendChild(el);
            });

            // Draw barriers
            map.barriers.forEach(barrier => {
                const el = document.createElement('div');
                el.className = `cell barrier ${barrier.type}`;
                el.style.left = `${barrier.x * CELL_SIZE}px`;
                el.style.top = `${barrier.y * CELL_SIZE}px`;
                el.style.width = `${CELL_SIZE}px`;
                el.style.height = `${CELL_SIZE}px`;
                el.innerHTML = barrier.type === 'red' ? 'R' : 'B';
                container.appendChild(el);
            });

            // Draw treasures
            map.treasures.forEach(treasure => {
                const el = document.createElement('div');
                el.className = 'cell treasure';
                el.style.left = `${treasure.x * CELL_SIZE}px`;
                el.style.top = `${treasure.y * CELL_SIZE}px`;
                el.style.width = `${CELL_SIZE}px`;
                el.style.height = `${CELL_SIZE}px`;
                el.textContent = treasure.label;
                container.appendChild(el);
            });

            // Draw agent start position
            if (map.agent) {
                const el = document.createElement('div');
                el.className = 'cell agent';
                el.style.left = `${map.agent.x * CELL_SIZE + 8}px`;
                el.style.top = `${map.agent.y * CELL_SIZE + 8}px`;
                el.style.width = `${CELL_SIZE - 16}px`;
                el.style.height = `${CELL_SIZE - 16}px`;
                container.appendChild(el);
            }

            // Signal ready for screenshot
            window.visualizationReady = true;
        }

        renderVisualization();
    </script>
</body>
</html>
